name: Signal F29 Build 1135 - Full ZIP tvOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tvos:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: extracted
    steps:
      - name: Checkout ZIP repository
        uses: actions/checkout@v4

      - name: Extract F29 source ZIP
        working-directory: .
        run: |
          set -euo pipefail
          ZIP="Signal_F29_Build1135_FULL_ZIP_WORKFLOW_READY.zip"
          test -f "$ZIP" || { echo "::error::Upload $ZIP to the repository root on the selected branch"; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          test -f extracted/project.yml
          test -f extracted/Scripts/check_f28_source_preflight.sh
          test -f extracted/Scripts/check_f29_build_identity.py

      - name: Verify Xcode and tvOS SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK="$(xcrun --sdk appletvos --show-sdk-version)"
          echo "tvOS SDK $SDK"
          test "${SDK%%.*}" -ge 26
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi

      - name: Validate F29 source
        run: |
          set -euo pipefail
          bash Scripts/check_f28_source_preflight.sh
          python3 Scripts/check_f29_build_identity.py
          python3 Scripts/check_f28_diagnostic_redaction.py
          python3 Scripts/check_f28_remote_thumbnail_gate.py

      - name: Install AetherEngine 7.44.0
        run: |
          set -euo pipefail
          bash Scripts/fetch_aether_f28_744.sh > f28-engine-install.log 2>&1
          python3 Scripts/verify_f28_aether_integration.py > f28-engine-verify.log 2>&1
          test "$(cat Vendor/AetherEngine/.signal-f28-version)" = "7.44.0"

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml > f28-preflight.log 2>&1

      - name: Compile unsigned tvOS app
        run: |
          set -euo pipefail
          xcodebuild -project DebridChannelsTVOS.xcodeproj -scheme 00_DebridChannelsTVOS -configuration Release -destination 'generic/platform=tvOS' -derivedDataPath "$RUNNER_TEMP/f29-derived" CODE_SIGNING_ALLOWED=NO build > f28-build.log 2>&1

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/f29-derived/Build/Products/Release-appletvos/DebridChannelsTVOS.app"
          if [ ! -d "$APP" ]; then
            APP="$(find "$RUNNER_TEMP/f29-derived/Build/Products/Release-appletvos" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          fi
          test -n "$APP" && test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Signal_F29_1135_unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Signal_F29_1135_unsigned_IPA
          path: extracted/Signal_F29_1135_unsigned.ipa
          if-no-files-found: error

      - name: Sanitize build diagnostics
        if: always()
        run: |
          if [ -f Scripts/sanitize_f28_build_logs.py ]; then
            python3 Scripts/sanitize_f28_build_logs.py
          fi

      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Signal_F29_1135_build_diagnostics
          path: extracted/f28-public-diagnostics/
          if-no-files-found: ignore
          
